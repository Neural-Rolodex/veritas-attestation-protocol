name: Feature Request
description: Propose a new capability, architectural optimization, or protocol enhancement
title: "[FEAT]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Please outline the proposed feature, rationale, and technical acceptance criteria.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or limitation does this feature resolve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Technical Design
      description: Architectural overview, data structures, and contract entry points.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Verifiable conditions required for completion.
    validations:
      required: true
